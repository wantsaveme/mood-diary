<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mood Diary</title>
  <style>
    body {
      background: #EBFAEC; /* 밝은 연초록 */
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    h1 {
      margin-bottom: 10px;
    }
    #authSection {
      margin: 20px 0;
    }
    button {
      margin: 5px;
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #A7ECA4;
      font-size: 16px;
    }
    button:hover {
      background: #8BD586;
    }
    .emotion-buttons button {
      display: inline-block;
      font-size: 20px;
    }
    #log {
      margin-top: 30px;
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>

<body>
  <h1>감정 일기</h1>

  <div id="authSection">
    <button id="loginButton">Google 로그인</button>
    <button id="logoutButton" style="display:none;">로그아웃</button>
  </div>

  <div class="emotion-buttons" id="emotionSection" style="display:none;">
    <p>지금 기분은?</p>
    <button data-emotion="happy">😊 행복</button>
    <button data-emotion="sad">😢 슬픔</button>
    <button data-emotion="angry">😡 화남</button>
    <button data-emotion="anxious">😰 불안</button>
    <button data-emotion="tired">🥱 피곤</button>
    <button data-emotion="ok">🙂 그냥저냥</button>
    <br><br>
    <textarea id="memo" placeholder="메모 입력" style="width:80%; height:70px;"></textarea>
    <br>
    <button id="saveButton">기록 저장</button>
  </div>

  <div id="log" style="display:none;">
    <h3>오늘 기록</h3>
    <ul id="entriesList"></ul>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    // Firebase SDKs
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
    import { getFirestore, collection, addDoc, query, where, getDocs } 
      from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

    // 🔹 Firebase 설정
    const firebaseConfig = {
      apiKey: "AIzaSyAanW1qTl0A5Xmnpx9y4sQlkky74Ef_XLA",
      authDomain: "mood-diary-deb15.firebaseapp.com",
      projectId: "mood-diary-deb15",
      storageBucket: "mood-diary-deb15.firebasestorage.app",
      messagingSenderId: "55138274698",
      appId: "1:55138274698:web:c6261e321870248e3d8c73"
    };

    // 초기화
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const loginButton = document.getElementById("loginButton");
    const logoutButton = document.getElementById("logoutButton");
    const emotionSection = document.getElementById("emotionSection");
    const saveButton = document.getElementById("saveButton");
    const entriesList = document.getElementById("entriesList");
    const logBox = document.getElementById("log");
    const memo = document.getElementById("memo");

    let selectedEmotion = null;

    document.querySelectorAll(".emotion-buttons button[data-emotion]").forEach(btn => {
      btn.addEventListener("click", () => {
        selectedEmotion = btn.dataset.emotion;
      });
    });

    loginButton.addEventListener("click", () => {
      signInWithPopup(auth, provider);
    });

    logoutButton.addEventListener("click", () => {
      signOut(auth);
    });

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        loginButton.style.display = "none";
        logoutButton.style.display = "inline-block";
        emotionSection.style.display = "block";
        logBox.style.display = "block";
        loadEntries(user);
      } else {
        loginButton.style.display = "inline-block";
        logoutButton.style.display = "none";
        emotionSection.style.display = "none";
        logBox.style.display = "none";
      }
    });

    saveButton.addEventListener("click", async () => {
      const user = auth.currentUser;
      if (!user) return alert("로그인이 필요합니다!");
      if (!selectedEmotion) return alert("감정을 선택해주세요!");

      await addDoc(collection(db, "entries"), {
        uid: user.uid,
        emotion: selectedEmotion,
        memo: memo.value || "",
        timestamp: new Date()
      });

      memo.value = "";
      selectedEmotion = null;
      alert("저장 완료!");
      loadEntries(user);
    });

    async function loadEntries(user) {
      entriesList.innerHTML = "";
      const q = query(collection(db, "entries"), where("uid", "==", user.uid));
      const snapshot = await getDocs(q);
      snapshot.forEach(doc => {
        const data = doc.data();
        const li = document.createElement("li");
        li.textContent = `${data.timestamp.toDate().toLocaleString()} - ${data.emotion} / ${data.memo}`;
        entriesList.appendChild(li);
      });
    }
  </script>
</body>
</html>
