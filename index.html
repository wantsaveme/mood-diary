<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>하루 감정 기록장</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Chart.js (감정 통계 그래프용) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #e6f7f2; /* 연한 민트 배경 */
      color: #1e3a32;
    }

    .page-wrap {
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px 8px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border-radius: 20px;
      padding: 18px 18px 24px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.06);
      border: 1px solid #c9e7db;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    h1 {
      font-size: 20px;
      margin: 0;
      color: #204036;
    }

    .subtitle {
      font-size: 12px;
      color: #56756a;
      margin-bottom: 10px;
    }

    .icon-button {
      border: none;
      background: #d9efe6;
      border-radius: 999px;
      padding: 8px 10px;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #204036;
    }

    .menu-panel {
      display: none;
      margin-bottom: 10px;
      padding: 8px 10px;
      background: #f1faf6;
      border-radius: 12px;
      font-size: 13px;
      color: #2a4a3d;
    }

    .menu-panel.visible {
      display: block;
    }

    .menu-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .menu-email {
      font-size: 12px;
      color: #56756a;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #d9efe6;
      color: #214238;
    }

    .today-line {
      font-size: 13px;
      color: #3a5c50;
      margin-bottom: 8px;
    }

    /* 감정 버튼들 */
    .mood-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .mood-btn {
      flex: 1 1 calc(33.33% - 8px);
      min-width: 90px;
      border-radius: 999px;
      border: 1px solid #cfe4da;
      background: #f4fbf7;
      padding: 8px 10px;
      font-size: 14px;
      text-align: center;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: background 0.15s, border-color 0.15s, transform 0.07s;
      color: #204036;
    }

    .mood-btn span.emoji {
      font-size: 18px;
    }

    .mood-btn:hover {
      background: #e6f4ee;
    }

    .mood-btn.active {
      background: #2f7c63;
      color: #ffffff;
      border-color: #245f4b;
      transform: translateY(1px);
    }

    .field-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    label {
      font-size: 12px;
      color: #56756a;
      white-space: nowrap;
    }

    input[type="time"] {
      flex: 1;
      padding: 6px 8px;
      border-radius: 10px;
      border: 1px solid #c9e7db;
      background: #f7fbf9;
      font-size: 13px;
      color: #204036;
    }

    textarea {
      width: 100%;
      min-height: 80px;
      padding: 8px;
      border-radius: 10px;
      border: 1px solid #c9e7db;
      background: #f7fbf9;
      font-size: 13px;
      color: #204036;
      resize: vertical;
      margin-bottom: 4px;
    }

    .hint {
      font-size: 11px;
      color: #7a968a;
      margin-bottom: 10px;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .btn-primary {
      background: #2f7c63;
      color: #ffffff;
    }

    .btn-primary:active {
      transform: translateY(1px);
    }

    .btn-secondary {
      background: #d9efe6;
      color: #214238;
    }

    .status {
      min-height: 18px;
      font-size: 12px;
      margin-top: 4px;
      margin-bottom: 6px;
      color: #1d7a4a;
    }

    .status.error {
      color: #b03a3a;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      margin: 16px 0 8px;
      color: #214238;
    }

    .today-box {
      margin-top: 8px;
      padding: 10px;
      background: #f4fbf7;
      border-radius: 12px;
      border: 1px solid #cfe4da;
      font-size: 13px;
      max-height: 220px;
      overflow-y: auto;
    }

    .today-item {
      padding: 6px 4px;
      border-bottom: 1px solid #e1f0e8;
    }

    .today-item:last-child {
      border-bottom: none;
    }

    .today-time {
      font-size: 12px;
      color: #305648;
      font-weight: 600;
    }

    .today-text {
      margin-top: 2px;
    }

    .empty-text {
      font-size: 13px;
      color: #7a968a;
    }

    /* 달력 */
    .calendar-wrap {
      display: none;
      margin-top: 10px;
      padding: 10px;
      border-radius: 12px;
      background: #f4fbf7;
      border: 1px solid #cfe4da;
      font-size: 12px;
    }

    .calendar-wrap.visible {
      display: block;
    }

    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .month-label {
      font-weight: 600;
      color: #204036;
    }

    .month-btn {
      border: none;
      background: #d9efe6;
      border-radius: 999px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 12px;
      color: #214238;
    }

    table.calendar {
      width: 100%;
      border-collapse: collapse;
      margin-top: 4px;
    }

    table.calendar th {
      padding: 4px;
      color: #56756a;
      font-weight: 500;
    }

    table.calendar td {
      height: 46px;
      text-align: center;
      vertical-align: top;
      padding: 2px;
      cursor: pointer;
    }

    .cal-cell-inner {
      border-radius: 8px;
      padding: 2px;
      transition: background 0.12s;
    }

    .cal-cell-inner:hover {
      background: rgba(47, 124, 99, 0.08);
    }

    .day-number {
      font-size: 11px;
      color: #3a5c50;
    }

    .day-emoji {
      font-size: 16px;
    }

    .history-detail {
      margin-top: 8px;
      max-height: 220px;
      overflow-y: auto;
      border-radius: 10px;
      background: #ffffff;
      border: 1px solid #cfe4da;
      padding: 6px 6px 4px;
    }

    .history-item {
      padding: 4px 4px;
      border-bottom: 1px solid #e1f0e8;
      font-size: 12px;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-date-line {
      font-size: 12px;
      margin-bottom: 4px;
      color: #305648;
      font-weight: 600;
    }

    /* 내보내기/불러오기 */
    .export-wrap {
      display: none;
      margin-top: 10px;
      padding: 10px;
      border-radius: 12px;
      background: #f4fbf7;
      border: 1px solid #cfe4da;
      font-size: 12px;
    }

    .export-wrap.visible {
      display: block;
    }

    .export-textarea {
      width: 100%;
      min-height: 150px;
      margin-top: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 11px;
      border-radius: 8px;
      border: 1px solid #c9e7db;
      padding: 6px;
      background: #ffffff;
      color: #204036;
    }

    /* 그래프 */
    .chart-wrap {
      margin-top: 10px;
      padding: 10px;
      border-radius: 12px;
      background: #f4fbf7;
      border: 1px solid #cfe4da;
      font-size: 12px;
    }

    canvas {
      max-width: 100%;
    }

    @media (max-width: 480px) {
      .container {
        border-radius: 0;
        box-shadow: none;
        border-left: none;
        border-right: none;
      }
    }
  </style>
</head>
<body>
<div class="page-wrap">
  <div class="container">
    <div class="header-row">
      <div>
        <h1>하루 감정 기록장</h1>
        <div class="subtitle">하루 동안 여러 번 바뀌는 감정을, 편하게 기록해 두는 곳이에요.</div>
      </div>
      <button class="icon-button" id="menuToggle" aria-label="메뉴 열기">
        ☰
      </button>
    </div>

    <div class="menu-panel" id="menuPanel">
      <div class="menu-row">
        <span class="badge" id="loginStatus">로그인 필요</span>
        <button class="icon-button" id="loginBtn">Google 로그인</button>
        <button class="icon-button" id="logoutBtn" style="display:none;">로그아웃</button>
      </div>
      <div class="menu-email" id="userEmail"></div>
    </div>

    <div class="today-line" id="todayText"></div>

    <div class="mood-row" id="moodRow">
      <button class="mood-btn" data-mood="happy">
        <span class="emoji">😊</span><span>행복</span>
      </button>
      <button class="mood-btn" data-mood="sad">
        <span class="emoji">😢</span><span>슬픔</span>
      </button>
      <button class="mood-btn" data-mood="angry">
        <span class="emoji">😡</span><span>화남</span>
      </button>
      <button class="mood-btn" data-mood="anxious">
        <span class="emoji">😰</span><span>불안</span>
      </button>
      <button class="mood-btn" data-mood="tired">
        <span class="emoji">🥱</span><span>피곤</span>
      </button>
      <button class="mood-btn" data-mood="meh">
        <span class="emoji">🙂</span><span>그냥저냥</span>
      </button>
    </div>

    <div class="field-row">
      <label for="timeInput">시간</label>
      <input type="time" id="timeInput">
    </div>

    <textarea id="noteInput" placeholder="왜 이런 기분이 되었는지, 간단히 적어도 좋고 비워도 괜찮아요."></textarea>

    <div class="hint">
      ※ 지금은 텍스트만 Firestore에 저장돼요. 사진 저장은 아직 구현되지 않았어요.
    </div>

    <button class="btn btn-primary" id="saveBtn">기록 추가</button>
    <div class="status" id="statusText"></div>

    <button class="btn btn-secondary" id="toggleCalendarBtn">기록 보기 (달력·세부)</button>
    <button class="btn btn-secondary" id="exportBtn">데이터 내보내기</button>
    <button class="btn btn-secondary" id="importBtn">데이터 불러오기</button>

    <div class="section-title">오늘 기록</div>
    <div class="today-box" id="todayBox">
      <div class="empty-text">아직 오늘 기록이 없어요.</div>
    </div>

    <!-- 달력 + 세부 기록 -->
    <div class="calendar-wrap" id="calendarWrap">
      <div class="month-nav">
        <button class="month-btn" id="prevMonthBtn">◀</button>
        <div class="month-label" id="monthLabel"></div>
        <button class="month-btn" id="nextMonthBtn">▶</button>
      </div>
      <table class="calendar" id="calendarTable"></table>
      <div class="history-detail" id="historyDetail">
        <div class="history-date-line">날짜를 누르면 세부 기록이 보여요.</div>
      </div>
    </div>

    <!-- 데이터 내보내기/불러오기 영역 -->
    <div class="export-wrap" id="exportWrap">
      <div>아래 내용을 길게 눌러 복사해서 메모앱·노션·PC 등에 붙여 넣을 수 있어요. (JSON 형식)</div>
      <textarea class="export-textarea" id="exportText" readonly></textarea>
    </div>

    <!-- 감정 통계 그래프 -->
    <div class="section-title">감정 통계</div>
    <div class="chart-wrap">
      <div style="font-size:12px; margin-bottom:4px;">
        선택된 달의 날짜별 평균 감정 점수를 선 그래프로 보여줘요.
        (행복 5 · 그냥저냥 3 · 피곤/불안 2 · 슬픔/화남 1)
      </div>
      <canvas id="moodChart" height="160"></canvas>
    </div>

  </div>
</div>

<script type="module">
  // ----- Firebase 초기화 (주인님 프로젝트 값 사용) -----
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    query,
    where,
    orderBy
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // 주인님이 콘솔에서 받은 설정값 (이미 공개용이라 클라이언트에 써도 됩니다)
  const firebaseConfig = {
    apiKey: "AIzaSyAanW1qTl0A5Xmnpx9y4sQlkky74Ef_XLA",
    authDomain: "mood-diary-deb15.firebaseapp.com",
    projectId: "mood-diary-deb15",
    storageBucket: "mood-diary-deb15.firebasestorage.app",
    messagingSenderId: "55138274698",
    appId: "1:55138274698:web:c6261e321870248e3d8c73"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();
  const db = getFirestore(app);

  // ----- DOM 참조 -----
  const menuToggle = document.getElementById("menuToggle");
  const menuPanel = document.getElementById("menuPanel");
  const loginStatus = document.getElementById("loginStatus");
  const loginBtn = document.getElementById("loginBtn");
  const logoutBtn = document.getElementById("logoutBtn");
  const userEmailEl = document.getElementById("userEmail");

  const todayText = document.getElementById("todayText");
  const moodButtons = Array.from(document.querySelectorAll(".mood-btn"));
  const timeInput = document.getElementById("timeInput");
  const noteInput = document.getElementById("noteInput");
  const saveBtn = document.getElementById("saveBtn");
  const statusText = document.getElementById("statusText");

  const todayBox = document.getElementById("todayBox");

  const toggleCalendarBtn = document.getElementById("toggleCalendarBtn");
  const calendarWrap = document.getElementById("calendarWrap");
  const calendarTable = document.getElementById("calendarTable");
  const monthLabel = document.getElementById("monthLabel");
  const prevMonthBtn = document.getElementById("prevMonthBtn");
  const nextMonthBtn = document.getElementById("nextMonthBtn");
  const historyDetail = document.getElementById("historyDetail");

  const exportBtn = document.getElementById("exportBtn");
  const importBtn = document.getElementById("importBtn");
  const exportWrap = document.getElementById("exportWrap");
  const exportText = document.getElementById("exportText");

  const moodChartCtx = document.getElementById("moodChart").getContext("2d");

  // ----- 상태 변수 -----
  let currentUser = null;
  let allEntries = []; // {id, dateString, dateTime, mood, note}
  let selectedMood = null;
  let currentMonthDate = new Date();
  let chart = null;

  // ----- 유틸 함수 -----
  function formatDateDisplay(d) {
    return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일`;
  }

  function getTodayString() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, "0");
    const d = String(now.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }

  function getDateStringFromDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function setStatus(msg, isError = false) {
    statusText.textContent = msg || "";
    statusText.classList.toggle("error", !!isError);
  }

  function moodEmoji(m) {
    const map = {
      happy: "😊",
      sad: "😢",
      angry: "😡",
      anxious: "😰",
      tired: "🥱",
      meh: "🙂"
    };
    return map[m] || "";
  }

  function moodScore(m) {
    // 설명: 행복5, 그냥저냥3, 피곤/불안2, 슬픔/화남1
    switch (m) {
      case "happy":
        return 5;
      case "meh":
        return 3;
      case "tired":
      case "anxious":
        return 2;
      case "sad":
      case "angry":
        return 1;
      default:
        return 3;
    }
  }

  function resetMoodButtons() {
    moodButtons.forEach(btn => btn.classList.remove("active"));
  }

  function renderTodayLine() {
    const now = new Date();
    todayText.textContent = "오늘: " + formatDateDisplay(now);
  }

  function renderTodayEntries() {
    const todayStr = getTodayString();
    const todayEntries = allEntries.filter(e => e.dateString === todayStr);

    todayBox.innerHTML = "";
    if (todayEntries.length === 0) {
      const div = document.createElement("div");
      div.className = "empty-text";
      div.textContent = "아직 오늘 기록이 없어요.";
      todayBox.appendChild(div);
      return;
    }

    todayEntries.sort((a, b) => a.dateTime.localeCompare(b.dateTime));

    for (const e of todayEntries) {
      const wrapper = document.createElement("div");
      wrapper.className = "today-item";

      const timeDiv = document.createElement("div");
      timeDiv.className = "today-time";
      const hm = e.dateTime.slice(11, 16);
      timeDiv.textContent = `${hm} · ${moodEmoji(e.mood)}`;

      const textDiv = document.createElement("div");
      textDiv.className = "today-text";
      textDiv.textContent = e.note && e.note.trim().length > 0 ? e.note : "(메모 없음)";

      wrapper.appendChild(timeDiv);
      wrapper.appendChild(textDiv);
      todayBox.appendChild(wrapper);
    }
  }

  // ----- 달력 & 통계 -----
  function renderCalendar() {
    const y = currentMonthDate.getFullYear();
    const m = currentMonthDate.getMonth(); // 0-based

    monthLabel.textContent = `${y}년 ${m + 1}월`;

    const firstDay = new Date(y, m, 1);
    const startWeek = firstDay.getDay();
    const lastDate = new Date(y, m + 1, 0).getDate();

    const entriesByDate = {};
    for (const e of allEntries) {
      if (!e.dateString.startsWith(`${y}-${String(m + 1).padStart(2, "0")}-`)) continue;
      if (!entriesByDate[e.dateString]) entriesByDate[e.dateString] = [];
      entriesByDate[e.dateString].push(e);
    }

    calendarTable.innerHTML = "";

    const thead = document.createElement("thead");
    const headRow = document.createElement("tr");
    ["일", "월", "화", "수", "목", "금", "토"].forEach(w => {
      const th = document.createElement("th");
      th.textContent = w;
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    calendarTable.appendChild(thead);

    const tbody = document.createElement("tbody");
    let row = document.createElement("tr");

    for (let i = 0; i < startWeek; i++) {
      const td = document.createElement("td");
      row.appendChild(td);
    }

    for (let d = 1; d <= lastDate; d++) {
      const weekdayIndex = (startWeek + d - 1) % 7;
      if (weekdayIndex === 0 && d !== 1) {
        tbody.appendChild(row);
        row = document.createElement("tr");
      }

      const td = document.createElement("td");
      const inner = document.createElement("div");
      inner.className = "cal-cell-inner";

      const dateStr = `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      const dayEntries = entriesByDate[dateStr] || [];

      const numDiv = document.createElement("div");
      numDiv.className = "day-number";
      numDiv.textContent = d;

      const emojiDiv = document.createElement("div");
      emojiDiv.className = "day-emoji";

      if (dayEntries.length > 0) {
        const countByMood = {};
        dayEntries.forEach(e => {
          countByMood[e.mood] = (countByMood[e.mood] || 0) + 1;
        });
        const sorted = Object.entries(countByMood).sort((a, b) => b[1] - a[1]);
        emojiDiv.textContent = moodEmoji(sorted[0][0]);
      } else {
        emojiDiv.textContent = "";
      }

      inner.appendChild(numDiv);
      inner.appendChild(emojiDiv);
      inner.addEventListener("click", () => showDayDetail(dateStr));
      td.appendChild(inner);
      row.appendChild(td);
    }

    tbody.appendChild(row);
    calendarTable.appendChild(tbody);

    renderChartForMonth();
  }

  function showDayDetail(dateStr) {
    const entries = allEntries
      .filter(e => e.dateString === dateStr)
      .sort((a, b) => a.dateTime.localeCompare(b.dateTime));

    historyDetail.innerHTML = "";

    const title = document.createElement("div");
    title.className = "history-date-line";
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) {
      title.textContent = `${dateStr} · 기록`;
    } else {
      title.textContent = `${formatDateDisplay(d)} · 기록 ${entries.length}개`;
    }
    historyDetail.appendChild(title);

    if (entries.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-text";
      empty.textContent = "이 날에는 기록이 없어요.";
      historyDetail.appendChild(empty);
      return;
    }

    for (const e of entries) {
      const item = document.createElement("div");
      item.className = "history-item";

      const hm = e.dateTime.slice(11, 16);
      item.innerHTML = `<strong>${hm}</strong> ${moodEmoji(e.mood)}<br>${e.note ? e.note : "(메모 없음)"}`;
      historyDetail.appendChild(item);
    }
  }

  function renderChartForMonth() {
    const y = currentMonthDate.getFullYear();
    const m = currentMonthDate.getMonth();

    const numDays = new Date(y, m + 1, 0).getDate();
    const labels = [];
    const scores = [];

    for (let d = 1; d <= numDays; d++) {
      const dateStr = `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      const entries = allEntries.filter(e => e.dateString === dateStr);
      labels.push(d.toString());

      if (entries.length === 0) {
        scores.push(null); // 그래프에서 비우기
      } else {
        const avg =
          entries.reduce((sum, e) => sum + moodScore(e.mood), 0) /
          entries.length;
        scores.push(Number(avg.toFixed(2)));
      }
    }

    if (chart) {
      chart.destroy();
    }

    chart = new Chart(moodChartCtx, {
      type: "line",
      data: {
        labels,
        datasets: [
          {
            label: "평균 감정 점수",
            data: scores,
            borderWidth: 2,
            tension: 0.3,
            spanGaps: false
          }
        ]
      },
      options: {
        responsive: true,
        plugins: {
          legend: {
            display: false
          }
        },
        scales: {
          y: {
            min: 0,
            max: 5,
            ticks: {
              stepSize: 1
            }
          }
        }
      }
    });
  }

  // ----- Firestore 연동 -----
  async function loadAllEntriesForUser() {
    if (!currentUser) {
      allEntries = [];
      renderTodayEntries();
      renderCalendar();
      return;
    }

    try {
      const colRef = collection(db, "entries");
      const q = query(
        colRef,
        where("userId", "==", currentUser.uid),
        orderBy("dateTime", "asc")
      );
      const snap = await getDocs(q);
      allEntries = snap.docs.map(doc => ({
        id: doc.id,
        ...doc.data()
      }));
      renderTodayEntries();
      renderCalendar();
    } catch (err) {
      console.error(err);
      setStatus("기록을 불러오는 중 오류가 발생했어요.", true);
    }
  }

  async function addEntry(mood, note, dateTimeISO, dateString) {
    if (!currentUser) {
      setStatus("먼저 Google 로그인을 해 주세요.", true);
      return;
    }

    try {
      const colRef = collection(db, "entries");
      const docRef = await addDoc(colRef, {
        userId: currentUser.uid,
        mood,
        note,
        dateTime: dateTimeISO,
        dateString,
        createdAt: new Date().toISOString() // 단순 ISO (serverTimestamp 대신)
      });

      allEntries.push({
        id: docRef.id,
        userId: currentUser.uid,
        mood,
        note,
        dateTime: dateTimeISO,
        dateString,
        createdAt: new Date().toISOString()
      });

      renderTodayEntries();
      renderCalendar();
      setStatus("기록이 저장됐어요.");
    } catch (err) {
      console.error(err);
      setStatus("기록 저장 중 오류가 발생했어요.", true);
    }
  }

  // ----- 이벤트 바인딩 -----
  // 메뉴 토글
  menuToggle.addEventListener("click", () => {
    menuPanel.classList.toggle("visible");
  });

  // 로그인 / 로그아웃
  loginBtn.addEventListener("click", async () => {
    try {
      await signInWithPopup(auth, provider);
      // onAuthStateChanged에서 후속 처리
    } catch (err) {
      console.error(err);
      alert("로그인 중 오류가 발생했어요.");
    }
  });

  logoutBtn.addEventListener("click", async () => {
    try {
      await signOut(auth);
    } catch (err) {
      console.error(err);
      alert("로그아웃 중 오류가 발생했어요.");
    }
  });

  onAuthStateChanged(auth, async (user) => {
    currentUser = user || null;
    if (currentUser) {
      loginStatus.textContent = "로그인됨";
      loginStatus.style.background = "#cceee1";
      loginBtn.style.display = "none";
      logoutBtn.style.display = "inline-flex";
      userEmailEl.textContent = currentUser.email || "";
    } else {
      loginStatus.textContent = "로그인 필요";
      loginStatus.style.background = "#d9efe6";
      loginBtn.style.display = "inline-flex";
      logoutBtn.style.display = "none";
      userEmailEl.textContent = "";
    }
    await loadAllEntriesForUser();
  });

  // 감정 버튼
  moodButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      const mood = btn.dataset.mood;
      selectedMood = mood;
      resetMoodButtons();
      btn.classList.add("active");
      setStatus("");
    });
  });

  // 기록 추가
  saveBtn.addEventListener("click", async () => {
    if (!currentUser) {
      setStatus("먼저 Google 로그인을 해 주세요.", true);
      return;
    }
    if (!selectedMood) {
      setStatus("감정을 하나 선택해 주세요.", true);
      return;
    }

    const now = new Date();
    const todayStr = getTodayString();

    let dt = new Date(
      `${todayStr}T${timeInput.value || "12:00"}:00`
    );
    if (isNaN(dt.getTime())) dt = now;

    const iso = dt.toISOString();
    const note = noteInput.value.trim();

    setStatus("기록을 저장 중입니다...");
    await addEntry(selectedMood, note, iso, getDateStringFromDate(dt));
    // 입력 유지(원하면 지워도 됨): 여기서는 메모만 비움
    noteInput.value = "";
  });

  // 달력 토글
  toggleCalendarBtn.addEventListener("click", () => {
    calendarWrap.classList.toggle("visible");
  });

  prevMonthBtn.addEventListener("click", () => {
    currentMonthDate.setMonth(currentMonthDate.getMonth() - 1);
    renderCalendar();
  });

  nextMonthBtn.addEventListener("click", () => {
    currentMonthDate.setMonth(currentMonthDate.getMonth() + 1);
    renderCalendar();
  });

  // 데이터 내보내기
  exportBtn.addEventListener("click", () => {
    if (!currentUser) {
      alert("먼저 Google 로그인을 해 주세요.");
      return;
    }
    if (!allEntries || allEntries.length === 0) {
      exportText.value = "// 아직 저장된 기록이 없습니다.";
    } else {
      const compact = allEntries.map(e => ({
        dateTime: e.dateTime,
        dateString: e.dateString,
        mood: e.mood,
        note: e.note || ""
      }));
      exportText.value = JSON.stringify(compact, null, 2);
    }
    exportWrap.classList.add("visible");
    setStatus("데이터를 내보냈어요. 아래 내용을 복사해서 보관할 수 있어요.");
  });

  // 데이터 불러오기
  importBtn.addEventListener("click", async () => {
    if (!currentUser) {
      alert("먼저 Google 로그인을 해 주세요.");
      return;
    }
    const input = prompt(
      "내보냈던 JSON 내용을 그대로 붙여 넣어 주세요.\n" +
      "※ 이 버전에서는 '이 사이트의 내보내기 버튼'으로 만든 JSON만 확실하게 지원합니다."
    );
    if (!input) return;

    let arr;
    try {
      arr = JSON.parse(input);
      if (!Array.isArray(arr)) throw new Error("array 아님");
    } catch (err) {
      console.error(err);
      alert("JSON 형식이 올바르지 않아요. 대괄호 [ ] 로 시작하는지 확인해 주세요.");
      return;
    }

    if (arr.length === 0) {
      setStatus("불러올 데이터가 0개예요. (배열이 비어 있어요.)", true);
      return;
    }

    setStatus(`데이터 ${arr.length}개를 불러오는 중입니다...`);

    try {
      let successCount = 0;
      for (const e of arr) {
        let dt;
        try {
          if (e.dateTime) {
            dt = new Date(e.dateTime);
          } else {
            dt = new Date();
          }
        } catch {
          dt = new Date();
        }
        if (isNaN(dt.getTime())) dt = new Date();

        const ds = e.dateString || getDateStringFromDate(dt);

        await addEntry(
          e.mood || "meh",
          e.note || "",
          dt.toISOString(),
          ds
        );
        successCount += 1;
      }
      await loadAllEntriesForUser();
      setStatus(`기록 불러오기가 완료됐어요. (총 ${successCount}개 추가됨)`);
      alert(`불러오기 완료: ${successCount}개 기록이 추가됐어요.`);
    } catch (err) {
      console.error(err);
      setStatus("기록 불러오기 중 오류가 발생했어요.", true);
    }
  });

  // ----- 초기 세팅 -----
  (function init() {
    // 오늘 날짜 문구
    renderTodayLine();

    // timeInput 기본값: 현재 시각 (분 단위)
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, "0");
    const mm = String(now.getMinutes()).padStart(2, "0");
    timeInput.value = `${hh}:${mm}`;

    // 로그인 상태 감시(onAuthStateChanged)에서 나머지 로딩을 처리함
  })();
</script>
</body>
</html>
